[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "LGPL-2.1-or-later"
rust-version = "1.99"
version = "0.1.0"

[workspace.dependencies]
bitflags = "=2.13.2"
zerocopy = { version = "=0.8.59", default-features = false, features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
toml = "=1.1.8"
object = { version = "=0.40.0", default-features = false, features = ["read_core", "pe", "std"] }
windows-bindgen = "=0.100.0"
windows-link = "=0.100.0"
windows-core = "=0.100.0"
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Media_Audio",
    "Win32_Media_Multimedia",
    "Win32_NetworkManagement_NetBios",
    "Win32_NetworkManagement_WNet",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
cap-std = "4.0.3"
rayon = "=1.12.0"

[profile.release]
overflow-checks = true
lto = "thin"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
