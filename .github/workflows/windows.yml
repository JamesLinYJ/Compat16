name: Windows build and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
            target: x86_64-pc-windows-msvc
            vs_architecture: amd64
          - runner: windows-11-arm
            architecture: arm64
            target: aarch64-pc-windows-msvc
            vs_architecture: arm64
    env:
      BUILD_ARCHITECTURE: ${{ matrix.architecture }}
      RUST_TARGET: ${{ matrix.target }}
      VS_ARCHITECTURE: ${{ matrix.vs_architecture }}
    steps:
      - name: Check out sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install the repository-pinned Rust toolchain
        id: toolchain
        timeout-minutes: 10
        run: |
          # Hosted Windows images include official rustup and MSVC. Installing
          # without a channel reads the profile, targets and components from
          # rust-toolchain.toml instead of maintaining another version pin here.
          rustup set default-host $env:RUST_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Could not select the native Rust host.' }
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw 'Could not install rust-toolchain.toml requirements.' }
          $version = @(rustc --version --verbose)
          if ($LASTEXITCODE -ne 0) { throw 'The pinned Rust compiler did not start.' }
          $version | Write-Output
          if ($version -notcontains "host: $env:RUST_TARGET") {
            throw "Rust must run natively on $env:RUST_TARGET."
          }
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'The pinned Cargo did not start.' }

      - name: Validate Win16 startup diagnostic contracts
        id: startup_contracts
        timeout-minutes: 3
        run: .\scripts\test-win16-startup-diagnostics.ps1

      - name: Run existing compatibility tests
        # A cold native ARM64 runner compiles both test harnesses and runs the
        # full suite here. Keep a bound without cancelling its final filters.
        timeout-minutes: 35
        run: |
          # build.ps1 restores its caller's environment. Initialize MSVC again
          # for tests rather than depending on a preceding build's side effects.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installations = @(& $vswhere -latest -products '*' -prerelease -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $installations.Count -eq 0) {
            throw 'Visual Studio C++ tools were not found.'
          }
          $vsInstall = ([string]$installations[0]).Trim()
          $vsDevCmd = Join-Path $vsInstall 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw 'Visual Studio developer command script was not found.'
          }
          $cargo = (Get-Command cargo.exe -CommandType Application -ErrorAction Stop).Source
          # Limit host/runtime coverage to pure/mock-backed library tests,
          # isolated filesystem tests, and owned-memory GDI fixtures. These
          # filters do not exercise redirected native stdin or open UI.
          $suites = @(
            '-p abi-schema',
            '-p abi-codegen',
            '-p build-tools',
            '-p x86-cpu',
            '-p text-codec',
            '-p dos-kernel',
            '-p host-services --lib filesystem::tests::seek::',
            '-p formats',
            '-p graphics',
            '-p devices',
            '-p host-services --lib diagnostics_tests::',
            '-p host-services --lib image_ownership_tests::',
            '-p host-services --lib system_colors_adapter_tests',
            '-p host-services --lib spool_document_tests',
            '-p host-services --lib spool_close_tests',
            '-p host-services --lib dialog_icon_',
            '-p runtime --lib dialog_icon_title_',
            '-p runtime --lib arrange_iconic_windows',
            '-p host-services --lib windows::vga_window::tests::',
            '-p runtime --lib input::tests::',
            '-p runtime --lib diagnostics::tests::',
            '-p win16-abi --lib',
            '-p runtime --lib driver_contract_',
            '-p runtime --lib ole_remainder_contract_',
            '-p runtime --lib session_exit_',
            '-p runtime --lib callback_instance_',
            '-p runtime --lib module_lookup_',
            '-p host-services --lib session_exit_',
            '-p host-services --lib system_timer_native_ -- --ignored --test-threads=1',
            '-p runtime --lib rectangle_exports',
            '-p runtime --lib safe_array_ptr_of_index',
            '-p runtime --lib is_equal_guid',
            '-p runtime --lib resource_metadata_',
            '-p runtime --lib hresult_tests',
            '-p runtime --lib put_element_',
            '-p runtime --lib brush_exports',
            '-p runtime --lib map_window_points',
            '-p host-services --lib create_new_',
            '-p runtime --lib create_new_',
            '-p runtime --lib caret_',
            '-p runtime --lib local_atom_',
            '-p runtime --lib local_handle_delta',
            '-p runtime --lib local_realloc_zero',
            '-p host-services --lib local_atom_',
            '-p runtime --lib class_data_',
            '-p runtime --lib system_colors_tests',
            '-p runtime --lib gdi_spool',
            '-p runtime --lib open_icon_tests',
            '-p runtime --lib close_window_tests',
            '-p runtime --lib set_parent_tests',
            '-p host-services --lib destruction_graph_tests',
            '-p runtime --lib destroy_receipt_tests',
            '-p runtime --lib callback_class_',
            '-p runtime --lib child_lookup',
            '-p runtime --lib dos_timestamp_tests',
            '-p runtime --lib parent_callback_tests',
            '-p runtime --lib dos_extended_open_tests',
            '-p host-services --lib extended_open -- --nocapture',
            '-p host-services --lib dos_timestamp_',
            '-p runtime --lib dos_temporary_file_tests',
            '-p host-services --lib input_status',
            '-p runtime --lib dos_interrupts::commit_tests',
            '-p host-services --lib file_commit',
            '-p host-services --lib file_set_write_time_',
            '-p runtime --lib set_window_pos_tests',
            '-p runtime --lib dos_interrupts::spool_tests',
            '-p runtime --lib dos_interrupts::dos_write_access_tests',
            '-p runtime --lib exec_fcb_',
            '-p runtime --lib ansi_next_',
            '-p host-services --lib ansi_next_',
            '-p host-services --lib ansi_prev_',
            # Keep the production-first concurrency probe in a fresh process.
            '-p host-services --lib windows::guest_text::metadata_tests::cold_code_page_production_probe -- --exact --test-threads=1 --nocapture',
            '-p host-services --lib windows::guest_text::metadata_tests::cold_code_page_extended_metadata -- --exact --test-threads=1 --nocapture',
            '-p host-services --lib code_page_metadata_ -- --test-threads=1 --nocapture',
            '-p runtime --lib lstrlen_',
            '-p runtime --lib dos_search_tests::',
            '-p runtime --lib get_char_width',
            '-p host-services --lib get_char_width',
            '-p runtime --lib get_outline_text_metrics',
            '-p host-services --lib get_outline_text_metrics',
            '-p runtime --lib keyboard_state_tests',
            '-p runtime --lib set_window_text_tests',
            '-p runtime --lib set_rect_rgn_tests',
            '-p runtime --lib line_dda::tests::',
            '-p runtime --lib global_memory::fix_void_tests::',
            '-p runtime --lib firmware_rom_',
            '-p runtime --lib execute::exit_tests::',
            '-p runtime --lib pe32_return_and_service_gates_preserve_boundary_budget',
            '-p runtime --lib character_classification',
            '-p host-services --lib character_classification',
            '-p runtime --lib any_popup',
            '-p host-services --lib any_popup',
            '-p runtime --lib get_cursor',
            '-p host-services --lib get_cursor_tests::',
            '-p runtime --lib get_clip_cursor',
            '-p host-services --lib get_clip_cursor',
            '-p runtime --lib enum_font_families',
            '-p runtime --lib returned_font_callback_page_lock_cleanup_retries_without_reentering_guest',
            '-p runtime --lib terminal_ownerless_far_callback_requires_complete_return_and_exact_top',
            '-p host-services --lib enum_font_families',
            '-p runtime --lib scroll_dc',
            '-p host-services --lib scroll_dc',
            '-p runtime --lib temp_drive::tests::',
            '-p runtime --lib get_temp_drive_tests::',
            '-p runtime --lib files::open_file_tests::',
            '-p host-services --lib windows::win16_open_file::tests::',
            '-p host-services --lib windows::win16_gdi_services::dbcs_tests::',
            '-p runtime --lib gdi_services::wire_tests::',
            '-p runtime --lib win16_runtime::task_state::tests::',
            '-p runtime --lib get_window_task_'
            '-p runtime --lib edit_scroll_'
            '-p runtime --lib task_ds_'
            '-p runtime --lib metafile::tests'
            '-p host-services --lib metafile_native_ -- --ignored --test-threads=1'
            '-p runtime --lib flash_window_'
            '-p runtime --lib win16_runtime::catch_throw::tests::'
            '-p runtime --lib escape_'
            '-p host-services --lib escape_'
            '-p host-services --lib dde_completion_'
            '-p runtime --lib initialization_tests::'
            '-p runtime --lib win16_runtime_dde::transfer::tests::'
            '-p runtime --lib win16_dde_callback::retirement::tests::'
            '-p host-services --lib dde_normal_tombstone_shutdown_'
            '-p host-services --lib dde_shutdown_'
            '-p runtime --lib win16_runtime::aux_tests::'
            '-p runtime --lib win16_runtime::comm::tests::'
            '-p runtime --lib win16_runtime::commdlg::hook_tests::'
            '-p runtime --lib win16_runtime::ctl3d::tests::'
            '-p runtime --lib win16_runtime::dispatch_user::system_parameters_tests::'
            '-p runtime --lib win16_runtime::dispatch_user::window_management_tests::'
            '-p runtime --lib win16_runtime::gdi_services::scalable_font_tests::'
            '-p runtime --lib win16_runtime::joystick::tests::'
            '-p runtime --lib win16_runtime::kernel_path_info::short_path_profile_struct_tests::'
            '-p runtime --lib win16_runtime::kernel_task::tests::'
            '-p runtime --lib win16_runtime::media_time::timer_tests::'
            '-p runtime --lib win16_runtime::mixer_tests::'
            '-p runtime --lib win16_host_mixer::session_tests::'
            '-p runtime --lib win16_runtime::user_drag::drag_tests::'
            '-p runtime --lib win16_runtime::winmem32::tests::'
            '-p runtime --lib win16_runtime::media_io::buffer_tests::'
            '-p runtime --lib win16_runtime::message_calls::timers::tests::'
            '-p runtime --lib win16_runtime::dispatch::input_event_tests::'
            '-p runtime --lib win16_runtime::ole1::tests::'
            '-p host-services --lib windows::win16_media_services::timer::tests::'
          )
          # Keep focused additions visible: a renamed filter must not silently
          # succeed after selecting zero tests.
          $expectedPassCounts = @{
            '-p runtime --lib session_exit_' = 2
            '-p runtime --lib edit_scroll_' = 1
            '-p runtime --lib task_ds_' = 1
            '-p runtime --lib callback_instance_' = 1
            '-p runtime --lib module_lookup_' = 6
            '-p host-services --lib session_exit_' = 2
            '-p host-services --lib system_timer_native_ -- --ignored --test-threads=1' = 2
            '-p host-services --lib diagnostics_tests::' = 5
            '-p runtime --lib temp_drive::tests::' = 6
            '-p runtime --lib get_temp_drive_tests::' = 6
            '-p runtime --lib files::open_file_tests::' = 7
            '-p host-services --lib windows::win16_open_file::tests::' = 14
            '-p host-services --lib windows::win16_gdi_services::dbcs_tests::' = 5
            '-p runtime --lib gdi_services::wire_tests::' = 2
            '-p runtime --lib win16_runtime::task_state::tests::' = 7
            '-p runtime --lib get_window_task_' = 6
            '-p runtime --lib flash_window_' = 6
            '-p runtime --lib win16_runtime::catch_throw::tests::' = 15
            '-p runtime --lib escape_' = 13
            '-p host-services --lib escape_' = 4
            '-p host-services --lib dde_completion_' = 5
            '-p runtime --lib metafile::tests' = 8
            '-p host-services --lib metafile_native_ -- --ignored --test-threads=1' = 9
            '-p runtime --lib initialization_tests::' = 17
            '-p runtime --lib win16_runtime_dde::transfer::tests::' = 16
            '-p runtime --lib win16_dde_callback::retirement::tests::' = 1
            '-p host-services --lib dde_normal_tombstone_shutdown_' = 2
            '-p host-services --lib dde_shutdown_' = 4
            '-p runtime --lib win16_runtime::aux_tests::' = 6
            '-p runtime --lib win16_runtime::comm::tests::' = 7
            '-p runtime --lib win16_runtime::commdlg::hook_tests::' = 5
            '-p runtime --lib win16_runtime::ctl3d::tests::' = 5
            '-p runtime --lib win16_runtime::dispatch_user::system_parameters_tests::' = 4
            '-p runtime --lib win16_runtime::dispatch_user::window_management_tests::' = 5
            '-p runtime --lib win16_runtime::gdi_services::scalable_font_tests::' = 5
            '-p runtime --lib win16_runtime::joystick::tests::' = 10
            '-p runtime --lib win16_runtime::kernel_path_info::short_path_profile_struct_tests::' = 9
            '-p runtime --lib win16_runtime::kernel_task::tests::' = 5
            '-p runtime --lib win16_runtime::media_time::timer_tests::' = 7
            '-p runtime --lib win16_runtime::mixer_tests::' = 4
            '-p runtime --lib win16_host_mixer::session_tests::' = 1
            '-p runtime --lib win16_runtime::user_drag::drag_tests::' = 8
            '-p runtime --lib win16_runtime::winmem32::tests::' = 4
            '-p runtime --lib win16_runtime::media_io::buffer_tests::' = 10
            '-p runtime --lib win16_runtime::message_calls::timers::tests::' = 3
            '-p runtime --lib win16_runtime::dispatch::input_event_tests::' = 2
            '-p runtime --lib win16_runtime::ole1::tests::' = 8
            '-p host-services --lib windows::win16_media_services::timer::tests::' = 3
          }
          $failedSuites = @()
          $hostCompileChecked = $false
          $hostCompileExitCode = 0
          $runtimeCompileChecked = $false
          $runtimeCompileExitCode = 0
          foreach ($suite in $suites) {
            if ($suite.StartsWith('-p host-services --lib ')) {
              if (-not $hostCompileChecked) {
                Write-Host '::group::Compile host-services library tests once'
                $command = 'call "{0}" -arch={1} -host_arch={1} && "{2}" test --locked --target {3} -p host-services --lib --no-run' -f $vsDevCmd, $env:VS_ARCHITECTURE, $cargo, $env:RUST_TARGET
                & $env:ComSpec /d /c $command
                $hostCompileExitCode = $LASTEXITCODE
                $hostCompileChecked = $true
                Write-Host "Host-services test compilation exit code: $hostCompileExitCode"
                Write-Host '::endgroup::'
                if ($hostCompileExitCode -ne 0) {
                  $failedSuites += "host-services library test compilation (exit $hostCompileExitCode)"
                }
              }
              if ($hostCompileExitCode -ne 0) {
                Write-Host "BLOCKED (not executed): cargo test $suite; host-services library test compilation failed."
                continue
              }
            }
            if ($suite.StartsWith('-p runtime --lib ')) {
              if (-not $runtimeCompileChecked) {
                Write-Host '::group::Compile runtime library tests once'
                $command = 'call "{0}" -arch={1} -host_arch={1} && "{2}" test --locked --target {3} -p runtime --lib --no-run' -f $vsDevCmd, $env:VS_ARCHITECTURE, $cargo, $env:RUST_TARGET
                & $env:ComSpec /d /c $command
                $runtimeCompileExitCode = $LASTEXITCODE
                $runtimeCompileChecked = $true
                Write-Host "Runtime test compilation exit code: $runtimeCompileExitCode"
                Write-Host '::endgroup::'
                if ($runtimeCompileExitCode -ne 0) {
                  $failedSuites += "runtime library test compilation (exit $runtimeCompileExitCode)"
                }
              }
              if ($runtimeCompileExitCode -ne 0) {
                Write-Host "BLOCKED (not executed): cargo test $suite; runtime library test compilation failed."
                continue
              }
            }
            Write-Host "::group::cargo test $suite"
            $command = 'call "{0}" -arch={1} -host_arch={1} && "{2}" test --locked --target {3} {4}' -f $vsDevCmd, $env:VS_ARCHITECTURE, $cargo, $env:RUST_TARGET, $suite
            if ($expectedPassCounts.ContainsKey($suite)) {
              $suiteOutput = @(& $env:ComSpec /d /c $command 2>&1)
              $testExitCode = $LASTEXITCODE
              $suiteOutput | ForEach-Object { Write-Host $_ }
              $expected = $expectedPassCounts[$suite]
              if (($suiteOutput -join "`n") -notmatch "test result: ok\. $expected passed; 0 failed; 0 ignored;") {
                $failedSuites += "$suite (expected $expected executed tests)"
              }
            } else {
              & $env:ComSpec /d /c $command
              $testExitCode = $LASTEXITCODE
            }
            Write-Host '::endgroup::'
            if ($testExitCode -ne 0) {
              $failedSuites += "$suite (exit $testExitCode)"
            }
          }
          if ($failedSuites.Count -gt 0) {
            throw ('Compatibility tests failed: ' + ($failedSuites -join '; '))
          }

      - name: Capture compiled ABI migration baseline
        id: abi_baseline
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installations = @(& $vswhere -latest -products '*' -prerelease -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $installations.Count -eq 0) { throw 'Visual Studio C++ tools unavailable.' }
          $vsDevCmd = Join-Path ([string]$installations[0]).Trim() 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) { throw 'Visual Studio developer script unavailable.' }
          $cargo = (Get-Command cargo.exe -CommandType Application -ErrorAction Stop).Source
          $directory = Join-Path $env:GITHUB_WORKSPACE 'target\abi-baseline'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $filter = 'exports::abi_baseline_tests::capture_compiled_abi_baseline'
          foreach ($name in @('compiled-abi.json', 'compiled-abi-repeat.json')) {
            $env:ABI_BASELINE_PATH = Join-Path $directory $name
            if (Test-Path -LiteralPath $env:ABI_BASELINE_PATH) { Remove-Item -LiteralPath $env:ABI_BASELINE_PATH -Force }
            $command = 'call "{0}" -arch={1} -host_arch={1} && "{2}" test --locked --target {3} -p win16-abi --lib {4} -- --ignored --exact --nocapture' -f $vsDevCmd, $env:VS_ARCHITECTURE, $cargo, $env:RUST_TARGET, $filter
            & $env:ComSpec /d /c $command
            if ($LASTEXITCODE -ne 0) { throw "ABI baseline capture failed: $name" }
            if (-not (Test-Path -LiteralPath $env:ABI_BASELINE_PATH -PathType Leaf)) { throw "ABI baseline was not produced: $name" }
          }
          $path = Join-Path $directory 'compiled-abi.json'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash
          $repeatHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $directory 'compiled-abi-repeat.json')).Hash
          if ($hash -ne $repeatHash) { throw 'ABI baseline capture was not deterministic.' }
          @{ commit = $env:GITHUB_SHA; architecture = $env:BUILD_ARCHITECTURE; sha256 = $hash } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $directory 'provenance.json') -Encoding utf8
          Write-Host "ABI_BASELINE_SHA256=$hash"
          # Retain a transport-safe copy in the exact job log as well as the artifact.
          $encoded = [Convert]::ToBase64String([IO.File]::ReadAllBytes($path))
          for ($offset = 0; $offset -lt $encoded.Length; $offset += 4096) {
            Write-Host ('ABI_BASELINE_BASE64:' + $encoded.Substring($offset, [Math]::Min(4096, $encoded.Length - $offset)))
          }

      - name: Retain compiled ABI baseline
        if: ${{ !cancelled() && steps.abi_baseline.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: abi-baseline-${{ matrix.architecture }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/abi-baseline/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Measure SFT representative selection
        # Selection-only microbenchmark; no timing pass/fail thresholds. Keep its
        # ignored test isolated from the ordinary noninteractive test filters.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installations = @(& $vswhere -latest -products '*' -prerelease -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $installations.Count -eq 0) {
            throw 'BLOCKED: Visual Studio C++ tools unavailable for SFT representative selection benchmark.'
          }
          $vsDevCmd = Join-Path ([string]$installations[0]).Trim() 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw 'BLOCKED: Visual Studio developer command script unavailable for SFT representative selection benchmark.'
          }
          $cargo = (Get-Command cargo.exe -CommandType Application -ErrorAction Stop).Source
          $filter = 'kernel::sft::tests::bench::representative_selection_microbenchmark'
          Write-Host 'Measure old and indexed selection across small, dense, and adversarial handle layouts.'
          $command = 'call "{0}" -arch={1} -host_arch={1} && "{2}" test --locked --target {3} -p dos-kernel --lib --release {4} -- --ignored --exact --test-threads=1 --nocapture' -f $vsDevCmd, $env:VS_ARCHITECTURE, $cargo, $env:RUST_TARGET, $filter
          & $env:ComSpec /d /c $command 2>&1 | Tee-Object -Variable probeOutput
          $probeExitCode = $LASTEXITCODE
          if ($probeExitCode -ne 0) {
            throw "UNSUPPORTED/FAILED: SFT representative selection benchmark (exit $probeExitCode); inspect benchmark output above."
          }
          if (($probeOutput -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') {
            throw 'BLOCKED: the exact SFT representative selection benchmark did not execute once.'
          }

      - name: Measure complete SFT refresh
        # Complete refresh with deterministic host; no timing thresholds. Keep its
        # ignored test isolated from the ordinary noninteractive test filters.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installations = @(& $vswhere -latest -products '*' -prerelease -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $installations.Count -eq 0) {
            throw 'BLOCKED: Visual Studio C++ tools unavailable for complete SFT refresh benchmark.'
          }
          $vsDevCmd = Join-Path ([string]$installations[0]).Trim() 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw 'BLOCKED: Visual Studio developer command script unavailable for complete SFT refresh benchmark.'
          }
          $cargo = (Get-Command cargo.exe -CommandType Application -ErrorAction Stop).Source
          $filter = 'kernel::sft::tests::refresh_bench::full_refresh_paired_benchmark'
          Write-Host 'Measure complete old and adaptive SFT refresh with matching guest writes and host calls.'
          $command = 'call "{0}" -arch={1} -host_arch={1} && "{2}" test --locked --target {3} -p dos-kernel --lib --release {4} -- --ignored --exact --test-threads=1 --nocapture' -f $vsDevCmd, $env:VS_ARCHITECTURE, $cargo, $env:RUST_TARGET, $filter
          & $env:ComSpec /d /c $command 2>&1 | Tee-Object -Variable probeOutput
          $probeExitCode = $LASTEXITCODE
          if ($probeExitCode -ne 0) {
            throw "UNSUPPORTED/FAILED: complete SFT refresh benchmark (exit $probeExitCode); inspect benchmark output above."
          }
          if (($probeOutput -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored;') {
            throw 'BLOCKED: the exact complete SFT refresh benchmark did not execute once.'
          }

      - name: Probe owned memory DC outline metrics
        # Owned memory DC and font only, no visible windows or input. Keep its
        # ignored test isolated from the ordinary noninteractive test filters.
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installations = @(& $vswhere -latest -products '*' -prerelease -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $installations.Count -eq 0) {
            throw 'BLOCKED: Visual Studio C++ tools unavailable for owned memory DC outline metrics.'
          }
          $vsDevCmd = Join-Path ([string]$installations[0]).Trim() 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
