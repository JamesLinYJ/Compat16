              $failedSuites += "$filter (UNSUPPORTED/FAILED: expected exactly one passing fixture)"
            }
          }
          if ($failedSuites.Count -gt 0) {
            throw ('UNSUPPORTED/FAILED: activation-capable OpenIcon capability validation: ' + ($failedSuites -join '; '))
          }

