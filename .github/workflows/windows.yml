        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        timeout-minutes: 5
        env:
          NATIVE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          NATIVE_RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          if ($env:NATIVE_RUNNER_ENVIRONMENT -cne 'github-hosted') {
            throw 'BLOCKED: activation-capable OpenIcon fixtures require a disposable GitHub-hosted runner; shared/self-hosted desktops are excluded.'
          }
          $supportedRunner = ($env:NATIVE_RUNNER_LABEL -ceq 'windows-2022' -and $env:BUILD_ARCHITECTURE -ceq 'x64') -or
            ($env:NATIVE_RUNNER_LABEL -ceq 'windows-11-arm' -and $env:BUILD_ARCHITECTURE -ceq 'arm64')
          if (-not $supportedRunner) {
            throw 'BLOCKED: activation-capable OpenIcon capability validation is limited to windows-2022 x64 and windows-11-arm ARM64.'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installations = @(& $vswhere -latest -products '*' -prerelease -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $installations.Count -eq 0) {
            throw 'BLOCKED: Visual Studio C++ tools unavailable for activation-capable OpenIcon fixtures.'
          }
          $vsDevCmd = Join-Path ([string]$installations[0]).Trim() 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $vsDevCmd -PathType Leaf)) {
            throw 'BLOCKED: Visual Studio developer command script unavailable for activation-capable OpenIcon fixtures.'
          }
          $cargo = (Get-Command cargo.exe -CommandType Application -ErrorAction Stop).Source
          Write-Host 'Capability validation only: OpenIcon fixtures may incidentally activate the disposable runner desktop.'
          $filters = @(
            'windows::win16_windows::win16_window_data::tests::open_icon_tests::open_icon_uses_native_success_and_query_open_veto',
            'windows::win16_windows::win16_window_data::tests::open_icon_tests::open_icon_reentry_rejects_replaced_identity_and_invalid_targets'
